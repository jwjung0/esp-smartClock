[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; LVGL + WiFi needs more than the default ~1.2MB app slot
board_build.partitions = huge_app.csv

[env:checkup]
build_flags = -DFIRMWARE_MODE_CHECKUP
build_src_filter = +<*> -<loading_gif.c>
; SquareLine / LVGL only needed for app firmware
lib_ignore =
	ui
	lvgl
	TFT_eSPI

[env:app]
lib_extra_dirs = smart_clock/libraries
lib_ldf_mode = deep+
; Arduino-ESP32 3.x: WiFi needs Network/src on the include path (LDF soft miss).
build_flags =
	-DFIRMWARE_MODE_APP
	-DLV_CONF_INCLUDE_SIMPLE
	-I${PROJECT_DIR}/smart_clock/libraries
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
