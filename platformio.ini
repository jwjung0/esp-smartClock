; Build: pio run -e app_<board>_<local|prod>  or  checkup_<board>
;   board:  esp32dev | s2mini
;   deploy: local | prod (app only)
; Scripts: ./scripts/build.sh [board] [local|prod]
;          ./scripts/flash.sh [board] [local|prod]
;          ./scripts/flash.sh checkup [board]
; Default: app esp32dev prod

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
	adafruit/Adafruit BME280 Library @ ^2.2.4
	adafruit/Adafruit BMP280 Library @ ^2.6.8
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	bblanchon/ArduinoJson @ ^7.3.0

; ---- shared mode / deploy fragments ----

[checkup]
build_src_filter = +<*> -<loading_gif.c>
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
	adafruit/Adafruit GFX Library @ ^1.11.11
lib_ignore =
	ui
	lvgl
	TFT_eSPI

[app]
lib_extra_dirs = smart_clock/libraries
lib_ldf_mode = deep+
; TFT_eSPI only picks up include/tft_setup.h if this path is on lib compile flags.
build_flags =
	-I${PROJECT_DIR}/include

[ingest_local]
build_flags = -DINGEST_ENV_LOCAL

[ingest_prod]
build_flags = -DINGEST_ENV_PROD

; ---- ESP32 DevKit ----

[env:checkup_esp32dev]
extends = checkup
board = esp32dev
build_flags =
	-DBOARD_ESP32DEV
	-DFIRMWARE_MODE_CHECKUP

[env:app_esp32dev_local]
extends = app, ingest_local
board = esp32dev
build_flags =
	${app.build_flags}
	${ingest_local.build_flags}
	-DBOARD_ESP32DEV
	-DFIRMWARE_MODE_APP
	-DLV_CONF_INCLUDE_SIMPLE
	-I${PROJECT_DIR}/smart_clock/libraries
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src

[env:app_esp32dev_prod]
extends = app, ingest_prod
board = esp32dev
build_flags =
	${app.build_flags}
	${ingest_prod.build_flags}
	-DBOARD_ESP32DEV
	-DFIRMWARE_MODE_APP
	-DLV_CONF_INCLUDE_SIMPLE
	-I${PROJECT_DIR}/smart_clock/libraries
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src

; ---- LOLIN / WEMOS S2 Mini (ESP32-S2) ----

[env:checkup_s2mini]
extends = checkup
board = lolin_s2_mini
build_flags =
	-DBOARD_S2_MINI
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
	-DFIRMWARE_MODE_CHECKUP

[env:app_s2mini_local]
extends = app, ingest_local
board = lolin_s2_mini
build_flags =
	${app.build_flags}
	${ingest_local.build_flags}
	-DBOARD_S2_MINI
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
	-DFIRMWARE_MODE_APP
	-DLV_CONF_INCLUDE_SIMPLE
	-I${PROJECT_DIR}/smart_clock/libraries
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src

[env:app_s2mini_prod]
extends = app, ingest_prod
board = lolin_s2_mini
build_flags =
	${app.build_flags}
	${ingest_prod.build_flags}
	-DBOARD_S2_MINI
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
	-DFIRMWARE_MODE_APP
	-DLV_CONF_INCLUDE_SIMPLE
	-I${PROJECT_DIR}/smart_clock/libraries
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
